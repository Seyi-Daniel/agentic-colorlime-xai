name: notebook
on:
  push:
  pull_request:
jobs:
  notebook:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-notebook.txt
      - name: Install notebook dependencies
        run: python -m pip install -r requirements-notebook.txt
      - name: Exercise LIME options and agent protocol
        run: python -m pytest tests/test_lime_notebook.py
      - name: Execute every notebook cell offline
        run: python scripts/execute_lime_notebook.py --output /tmp/agentic_lime_demo_executed.ipynb
      - uses: actions/upload-artifact@v4
        with:
          name: executed-lime-demo
          path: /tmp/agentic_lime_demo_executed.ipynb
