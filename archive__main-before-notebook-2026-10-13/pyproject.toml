[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-colorlime-xai"
version = "0.1.0"
description = "Code-grounded agentic selection and evaluation of image-LIME segmentation methods"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Daniel Odun-Ayo"},
]
keywords = [
  "explainable-ai",
  "agentic-ai",
  "lime",
  "computer-vision",
  "image-classification",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "lime>=0.2.0.1",
  "numpy>=1.26",
  "openai>=1.75.0",
  "pillow>=10.3",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "scikit-image>=0.25",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
runtime = [
  "accelerate>=1.0",
  "torch>=2.2",
  "transformers>=4.45",
]
ui = [
  "matplotlib>=3.8",
  "pandas>=2.2",
  "streamlit>=1.36",
]
test = [
  "pytest>=8.0",
  "ruff>=0.6",
]
all = [
  "accelerate>=1.0",
  "matplotlib>=3.8",
  "pandas>=2.2",
  "pytest>=8.0",
  "ruff>=0.6",
  "streamlit>=1.36",
  "torch>=2.2",
  "transformers>=4.45",
]

[project.scripts]
agentic-colorlime = "agentic_colorlime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
