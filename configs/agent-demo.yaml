name: agent-demo
description: Balanced interactive profile for the code-grounded agent.

application:
  model_id: google/vit-base-patch16-224
  openai_model: gpt-5-mini
  device: auto
  send_visuals_to_agent: true
  output_root: outputs

experiment:
  shap_num_samples: 512
  shap_max_segments: 256
  lime_lasso_alpha: 0.001
  lime_num_samples: 500
  lime_batch_size: 32
  inference_batch_size: 16
  random_seed: 42
  hide_color: 0
  critical_area_fraction: 0.20
  omission_rgb: [0, 0, 0]
  slic_n_segments: 100
  slic_compactness: 10.0
  slic_sigma: 1.0
  quickshift_kernel_size: 3
  quickshift_max_dist: 6
  quickshift_ratio: 0.5
  felzenszwalb_scale: 100.0
  felzenszwalb_sigma: 0.5
  felzenszwalb_min_size: 50
  watershed_markers: 100
  watershed_compactness: 0.001
  colorlime_k: 128
  colorlime_n_init: 3
  colorlime_max_iter: 200
  colorlime_tol: 0.0001

